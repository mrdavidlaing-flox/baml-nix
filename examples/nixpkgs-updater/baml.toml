[package]
name = "nixpkgs_updater"

# This project is written for BAML 0.24.0. Under Nix, `baml` refuses to run
# it with any other version instead of silently using what's installed.
[toolchain]
version = "0.24.0"

[generator.python]
output_type = "python/pydantic"
output_dir = "."
naming_convention = "language"
